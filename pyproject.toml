[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "milk-frog-companion"
version = "0.1.0"
description = "Local-first Milk Frog workflow companion"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<0.116", "pydantic>=2.10,<3", "uvicorn>=0.30,<1", "cryptography>=43", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["milk_frog*"]

[tool.setuptools.package-data]
milk_frog = ["workflows/*.json"]
